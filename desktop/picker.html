<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Share your screen</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #2b2d31; color: #f2f3f5; display: flex; flex-direction: column; height: 100vh; user-select: none; }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 4px 0 0; color: #b5bac1; font-size: 13px; }
  .tabs { display: flex; gap: 8px; padding: 12px 24px 0; }
  .tab { padding: 6px 14px; border-radius: 6px; background: transparent; border: none; color: #b5bac1; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab.on { background: #383a40; color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 16px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; align-content: start; }
  .card { background: #1e1f22; border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; }
  .card:hover { background: #232428; }
  .card.on { border-color: #5865f2; background: #232428; }
  .card img { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #111214; border-radius: 6px; display: block; }
  .card span { display: block; margin-top: 8px; font-size: 12px; color: #dbdee1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { padding: 14px 24px; background: #232428; display: flex; justify-content: flex-end; gap: 10px; }
  button.act { padding: 9px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #cancel { background: transparent; color: #dbdee1; }
  #share { background: #5865f2; color: #fff; }
  #share:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>
<header><h1>Share your screen</h1><p>Choose a screen or a window. The other person will see it live.</p></header>
<div class="tabs"><button class="tab on" data-k="screen">Screens</button><button class="tab" data-k="window">Windows</button></div>
<main id="grid"></main>
<footer><button class="act" id="cancel">Cancel</button><button class="act" id="share" disabled>Share</button></footer>
<script>
  let items = [], kind = 'screen', selected = null;
  const grid = document.getElementById('grid'), share = document.getElementById('share');
  function render() {
    grid.textContent = '';
    items.filter(i => (kind === 'screen') === i.screen).forEach(i => {
      const c = document.createElement('div'); c.className = 'card' + (i.id === selected ? ' on' : '');
      const img = document.createElement('img'); img.src = i.thumb;
      const s = document.createElement('span'); s.textContent = i.name;
      c.append(img, s);
      c.onclick = () => { selected = i.id; share.disabled = false; render(); };
      c.ondblclick = () => window.picker.choose(i.id);
      grid.appendChild(c);
    });
  }
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); t.classList.add('on');
    kind = t.dataset.k; selected = null; share.disabled = true; render();
  });
  document.getElementById('cancel').onclick = () => window.picker.choose(null);
  share.onclick = () => window.picker.choose(selected);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') window.picker.choose(null); });
  window.picker.sources().then(s => {
    items = s;
    if (!items.some(i => i.screen)) { kind = 'window'; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.k === 'window')); }
    render();
  });
</script>
</body>
</html>
